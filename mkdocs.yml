# The name is an acronym: n(ext) g(eneration file format) IO. Lowercased, because the
# project styles itself lowercase everywhere else. What the library actually does is
# spelled out in `site_description` and on the landing page.
site_name: "ngio: next generation file format IO"
# The published docs root (mike serves versions beneath it, e.g. /ngio/stable/).
# This was previously the git clone URL, which produced wrong canonical links and, under
# Zensical, a bogus /BioVisionCenter/ngio.git/ base path when serving locally.
site_url: "https://biovisioncenter.github.io/ngio/"
site_description: "A Python library for OME-Zarr bioimage analysis"
repo_name: "ngio"
repo_url: "https://github.com/BioVisionCenter/ngio"
copyright: "Copyright &copy; 2024-2026, BioVisionCenter UZH"
# GitHub's default branch here is `main`. Zensical would otherwise derive
# `edit/master/docs` (config.py:439-453) and every edit link would 404.
edit_uri: edit/main/docs/

# The snippet scripts are executed into the docs via pymdownx.snippets, which reads them
# from the filesystem rather than from the page tree.
# NOTE: Zensical does not honour `exclude_docs`, so the .py files are still copied into
# the built site as static assets (they are not rendered as pages). Harmless — they are
# already public in the repo — but that is why they show up under site/snippets/.
exclude_docs: |
  snippets/

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  # Space Grotesk (display face) is loaded from ngio.css; theme.font only
  # manages the text and code families.
  font:
    text: IBM Plex Sans
    code: JetBrains Mono
  # The real brand palette lives in stylesheets/ngio.css as variable overrides;
  # config only picks the nearest stock name so the toggle behaves.
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  # Only flags Zensical's templates actually read are listed. Previously enabled but
  # absent from zensical/templates/, i.e. dead config: navigation.instant, toc.follow,
  # search.suggest, search.share.
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant.progress
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top

extra_css:
  - stylesheets/ngio.css

extra:
  homepage: https://biovisioncenter.github.io/ngio/
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: "https://github.com/BioVisionCenter/ngio"
      name: ngio on GitHub
    - icon: fontawesome/brands/python
      link: "https://pypi.org/project/ngio/"
      name: ngio on PyPI
    - icon: fontawesome/solid/microscope
      link: "https://www.biovisioncenter.uzh.ch/en.html"
      name: BioVisionCenter, University of Zurich

plugins:
  - search
  - autorefs
  - markdown-exec
  - mkdocstrings:
      handlers:
        python:
          import:
            - https://docs.python.org/3/objects.inv
            - https://numpy.org/doc/stable/objects.inv
          options:
            heading_level: 3
            docstring_style: google
            show_source: true
            show_signature_annotations: true
            show_root_heading: true
            show_root_full_path: true
            show_bases: true
            docstring_section_style: list
            extensions:
              - griffe_typingdoc
            show_if_no_docstring: true
            inherited_members: true
            members_order: source
            separate_signature: true
            unwrap_annotated: false
            filters:
            - '!^_'
            merge_init_into_class: true
            signature_crossrefs: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true

# IMPORTANT: declaring this key REPLACES Zensical's ~30 defaults rather than extending
# them (zensical/config.py:656 — `config.get("markdown_extensions", DEFAULT_...)`), so
# everything we rely on must be listed here explicitly. Omitting `tables` is what once
# made pipe tables render as literal `|---|` text; omitting `attr_list` silently broke
# `content.code.annotate`, and omitting `abbr` broke `content.tooltips`.
# Deliberately NOT restored from Zensical's defaults:
#   pymdownx.smartsymbols — rewrites `<--` to an arrow, and every snippet include
#     contains `--8<--`; not worth the risk for the gain.
#   pymdownx.caret / tilde — turn `^x^` / `~x~` into super/subscript, a latent trap in
#     prose about array axes and dtypes.
#   pymdownx.magiclink — changes how bare URLs render across existing pages.
#   pymdownx.arithmatex — no maths in these docs.
markdown_extensions:
  - abbr                  # glossary tooltips (with content.tooltips)
  - admonition
  - attr_list             # grid cards, code annotations, link attributes
  - def_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.details
  # NB: zensical.extensions.emoji, not material.extensions.emoji — mkdocs-material is
  # not installed since the Zensical migration.
  - pymdownx.emoji:
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
      auto_append:
        - docs/_glossary.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
      toc_depth: 3


# Nav labels are sentence case, like every other heading and title on the site.
