# CI (pip) — supplementary pip-based tests
#
# Scope:    Runs after the main CI passes on main, plus weekly. Validates what end users
#           actually install via pip (not a pixi editable install) and tests against
#           pre-release dependencies to catch upstream breakage early.
# Jobs:     test-pip (stable deps), test-pip-pre (--pre deps)
# Matrix:   ubuntu × py3.13 only (full matrix is covered by ci.yml)
name: CI (pip)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test-pip:
    name: pip (stable)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    # For workflow_run: only proceed if the main CI succeeded
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🐍 Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install Dependencies
        run: |
          python -m pip install -U pip
          python -m pip install .[test]

      - name: Restore shared data cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/
          key: "${{ runner.os }}-data-${{ hashFiles('src/ngio/utils/_datasets.py') }}"
          restore-keys: |
            ${{ runner.os }}-data-

      - name: 🧪 Run Tests
        run: pytest -n 4 --durations=10

      - name: 📝 Report Failures
        if: failure() && github.event_name == 'schedule'
        uses: ./.github/actions/report-failure
        with:
          title: "[test-bot] pip stable tests are failing"
          platform: ubuntu-latest
          python: "py3.13, pip stable"
          token: ${{ github.token }}

  test-pip-pre:
    name: pip (--pre)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    # For workflow_run: only proceed if the main CI succeeded
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🐍 Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install Dependencies (pre-release)
        run: |
          python -m pip install -U pip
          python -m pip install .[test] --pre

      - name: Restore shared data cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/
          key: "${{ runner.os }}-data-${{ hashFiles('src/ngio/utils/_datasets.py') }}"
          restore-keys: |
            ${{ runner.os }}-data-

      - name: 🧪 Run Tests
        run: pytest -n 4 --durations=10

      - name: 📝 Report Failures
        if: failure()
        uses: ./.github/actions/report-failure
        with:
          title: "[test-bot] pip --pre tests are failing"
          platform: ubuntu-latest
          python: "py3.13, pip --pre"
          token: ${{ github.token }}
