# Docs — documentation build and deploy
#
# Scope:    Runs on push to main and publishes the `dev` version. Uses the pixi
#           docs environment for reproducible builds.
# Jobs:     deploy (mike + zensical)
#
# Note:     The docs are built by Zensical, and versioned with the Zensical maintainers'
#           fork of mike (installed from git via the pixi docs feature, since it is not
#           published to PyPI). The mike CLI and the gh-pages layout are unchanged, so
#           already-published versions stay browsable.
#
#           Tags are deliberately NOT handled here, and neither is the default
#           version. `stable` and the default are published by the `deploy-docs`
#           job in ci.yml, which runs only after the test matrix has passed and
#           the release has reached PyPI. Triggering on tags from this workflow
#           would race those gates.
name: Docs

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  deploy:
    name: deploy docs
    runs-on: ubuntu-latest

    permissions:
      contents: write # mike pushes the built docs to the gh-pages branch

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🔧 Set up pixi
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          environments: docs

      # `mike deploy` builds the site itself, but its internal build is not strict:
      # `zensical build` exits 0 even when a markdown-exec code block raises, which
      # would publish tracebacks. Build once up front with --strict to fail fast.
      - name: 🔍 Verify docs build
        run: pixi run -e docs build_docs

      - name: Deploy docs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Checkout uses persist-credentials: false; authenticate the push that
          # mike performs to the gh-pages branch via the gh credential helper.
          gh auth setup-git
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Publish `dev`, but do NOT touch the default. The default belongs to
          # `stable` and is set once per release by ci.yml; setting it here made
          # every merge to main silently undo that, so the docs landing page
          # served unreleased docs to everyone from the first merge after a tag.
          pixi run -e docs mike deploy --push dev
          echo "Deployed development version (dev) from main; default unchanged"
