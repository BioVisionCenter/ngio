# Hooks are run by `prek` (a drop-in reimplementation of pre-commit), both in the
# `lint` CI job and via `pixi run -e dev lint`. Bump the `rev:` pins with
# `prek auto-update`.

# Vendored third-party files, kept byte-identical to what upstream ships. The SIL OFL
# text in particular should not be rewritten by the whitespace hooks.
exclude: ^docs/assets/fonts/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # mkdocs.yml uses `!!python/name:` tags for the pymdownx.emoji generator/index,
        # which the safe YAML loader cannot construct. Excluded here rather than passing
        # --unsafe, so every other YAML file (CI workflows included) stays fully checked.
        exclude: ^mkdocs\.yml$
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-added-large-files
        exclude: "pixi\\.lock"
      - id: check-case-conflict

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.25
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/crate-ci/typos
    rev: v1.44.0
    hooks:
      - id: typos
        args: [--force-exclude, --write-changes]

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.15.6
    hooks:
      - id: ruff
        args: [--fix]  # may also add '--unsafe-fixes'
      - id: ruff-format

# `ty` is deliberately not a hook here: it needs the locked pixi environment to
# resolve ngio's dependencies, which neither the `lint` job nor pre-commit.ci
# provides. It runs in the `typecheck` job in ci.yml instead, which `deploy`
# depends on. Locally: `pixi run -e dev ty check src/`.
